<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Montfort Farewell E-Pass</title>
    <meta name="description" content="Montfort World School farewell e-pass portal for students and organizers." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero-banner">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="brand-row">
          <img src="logo.svg" alt="Montfort World School logo" class="brand-logo" />
          <div class="brand-copy">
            <p class="small-label">Class XII Farewell 2026</p>
            <h1>MONTFORT</h1>
          </div>
        </div>
        <div class="divider"></div>
        <h2>FAREWELL 2026</h2>
      </div>
    </header>

    <main class="page-shell">
      <section class="main-panel card">
        <div class="panel-header">
          <div>
            <p class="section-kicker">Student E-Pass</p>
            <h3>Generate your entry pass</h3>
          </div>
          <a class="header-link" href="organizer.html">Organizer portal</a>
        </div>

        <div class="pass-layout">
          <form id="studentForm" class="pass-form">
            <label>
              Full name
              <input id="studentName" type="text" placeholder="Enter your full name" required />
            </label>

            <label>
              Phone number
              <input id="phoneNumber" type="tel" placeholder="Enter your phone number" required />
            </label>

            <button type="submit" class="primary-btn">Generate QR Pass</button>
            <p class="helper-text">Your pass will be valid for the farewell entry desk.</p>
          </form>

          <div class="pass-preview">
            <div class="preview-card">
              <div class="preview-top">
                <span class="school-chip">Montfort World School</span>
                <span class="status-pill">Pending</span>
              </div>

              <div class="preview-body">
                <div>
                  <small>Name</small>
                  <strong id="previewName">Your Name</strong>
                </div>
                <div>
                  <small>Phone</small>
                  <strong id="previewPhone">+91 ---------</strong>
                </div>
              </div>

              <div class="qr-box">
                <canvas id="qrCanvas" width="220" height="220"></canvas>
              </div>

              <div class="preview-footer">
                <div>
                  <small>Pass ID</small>
                  <strong id="previewCode">--</strong>
                </div>
                <button type="button" id="copyPass" class="secondary-btn">Copy</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
